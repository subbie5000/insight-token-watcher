name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build InsightTokenWatcher.sln -c Release
      - name: Test
        run: dotnet run --project tests/InsightTokenWatcher.CoreTests -c Release --no-build
